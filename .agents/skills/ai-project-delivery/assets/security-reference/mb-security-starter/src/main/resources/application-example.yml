# Sanitized reference configuration. Required secrets have no fallback value.
spring:
  application:
    name: ${APP_NAME}

mb:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: ${JWT_ACCESS_TTL_SECONDS:900}
      refresh-token-expiration: ${JWT_REFRESH_TTL_SECONDS:86400}
      issuer: ${JWT_ISSUER}

    password:
      # Compatibility reference only. New systems should evaluate Argon2id.
      bcrypt-strength: ${BCRYPT_STRENGTH:12}
      max-attempts: ${AUTH_MAX_ATTEMPTS:5}
      lock-duration: ${AUTH_LOCK_SECONDS:900}

    oauth2:
      enabled: ${OAUTH2_ENABLED:false}
      success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT}
      failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT}
      providers:
        google:
          client-id: ${GOOGLE_CLIENT_ID}
          client-secret: ${GOOGLE_CLIENT_SECRET}
          redirect-uri: ${GOOGLE_REDIRECT_URI}
          scope: [openid, email, profile]
        facebook:
          client-id: ${FACEBOOK_APP_ID}
          client-secret: ${FACEBOOK_APP_SECRET}
          redirect-uri: ${FACEBOOK_REDIRECT_URI}
          scope: [email, public_profile]

    cors:
      allowed-origins: ${CORS_ORIGINS}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: Authorization,Content-Type,X-CSRF-TOKEN
      exposed-headers: X-Request-ID
      allow-credentials: true
      max-age: ${CORS_MAX_AGE_SECONDS:600}

    cookie:
      domain: ${COOKIE_DOMAIN}
      secure: true
      path: /
      http-only: true
      # Lax supports common OAuth redirects; threat model may require Strict.
      same-site: Lax

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

logging:
  level:
    com.mb.security: INFO
    org.springframework.security: WARN
    org.springframework.security.oauth2: INFO
